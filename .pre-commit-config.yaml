repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check src tests scripts benchmarks
        language: system
        pass_filenames: false
      - id: compileall
        name: compileall
        entry: python3 -m compileall -q src tests scripts benchmarks
        language: system
        pass_filenames: false
      - id: unittest
        name: unittest
        entry: python3 -m unittest -q
        language: system
        pass_filenames: false
