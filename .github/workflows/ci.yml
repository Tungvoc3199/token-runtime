name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install TOKEN
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install . --no-build-isolation

      - name: Unit tests
        run: python -m unittest -q

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Import and CLI smoke
        run: |
          python -c "import token_runtime"
          token --help >/dev/null

      - name: Whitespace gate
        run: git diff-tree --check --root HEAD
