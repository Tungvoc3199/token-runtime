name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install TOKEN dev tooling
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e '.[dev]' --no-build-isolation

      - name: Ruff
        run: ruff check src tests scripts benchmarks

      - name: Unit tests with coverage
        run: |
          coverage run -m unittest -q
          coverage report --fail-under=80

      - name: Compile check
        run: python -m compileall -q src tests scripts benchmarks

      - name: Import and CLI smoke
        run: |
          python -c "import token_runtime"
          token --help >/dev/null

      - name: Public-source audit
        run: python scripts/public_audit.py --source-tree .

      - name: Whitespace gate
        run: git diff-tree --check --root HEAD
