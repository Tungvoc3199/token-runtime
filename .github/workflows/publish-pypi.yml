name: Publish token-runtime to PyPI

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful Distribution qualification workflow run ID
        required: true
        type: string
      publish:
        description: Publish after verification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_label: ${{ steps.bundle.outputs.release_label }}
      wheel_sha: ${{ steps.bundle.outputs.wheel_sha }}
      sdist_sha: ${{ steps.bundle.outputs.sdist_sha }}
    steps:
      - name: Checkout verification code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify qualification run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .conclusion)" = "success"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)" = "${GITHUB_SHA}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .path)" = ".github/workflows/distribution.yml"

      - name: Download qualified bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: token-runtime-v0.1.0-alpha.2-qualified
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}

      - name: Verify qualified bytes without rebuilding
        id: bundle
        run: |
          python scripts/distribution.py verify --bundle release
          python -c "import json; from pathlib import Path; from scripts.public_release import tree_digest; p=json.load(open('release/TOKEN_DISTRIBUTION_PROVENANCE.json')); assert p['source_runtime_sha256'] == tree_digest(Path('src/token_runtime')), 'bundle runtime digest mismatch'"
          python -c "import json; d=json.load(open('release/TOKEN_DISTRIBUTION_PROVENANCE.json')); print('release_label='+d['release_label'])" >> "${GITHUB_OUTPUT}"
          echo "wheel_sha=$(sha256sum release/dist/token_runtime-0.1.0a2-py3-none-any.whl | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          echo "sdist_sha=$(sha256sum release/dist/token_runtime-0.1.0a2.tar.gz | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          RELEASE_LABEL="$(python -c "import json; print(json.load(open('release/TOKEN_DISTRIBUTION_PROVENANCE.json'))['release_label'])")"
          case "${GITHUB_REF}" in refs/tags/*) test "${GITHUB_REF}" = "refs/tags/${RELEASE_LABEL}" ;; *) : ;; esac

  publish:
    needs: verify
    if: github.event.inputs.publish == 'true' && github.ref == format('refs/tags/{0}', needs.verify.outputs.release_label)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/token-runtime
    steps:
      - name: Download the same qualified bundle
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: token-runtime-v0.1.0-alpha.2-qualified
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}

      - name: Verify artifact hash identity
        env:
          EXPECTED_WHEEL_SHA: ${{ needs.verify.outputs.wheel_sha }}
          EXPECTED_SDIST_SHA: ${{ needs.verify.outputs.sdist_sha }}
        run: |
          test "$(sha256sum release/dist/token_runtime-0.1.0a2-py3-none-any.whl | cut -d' ' -f1)" = "${EXPECTED_WHEEL_SHA}"
          test "$(sha256sum release/dist/token_runtime-0.1.0a2.tar.gz | cut -d' ' -f1)" = "${EXPECTED_SDIST_SHA}"

      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release/dist
