name: Bug report
description: Report a reproducible TOKEN defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal safe steps or fixture. Remove credentials and private prompt content.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: TOKEN version, Python version, OS, client/protocol.
